---
name: 'Release'
on:
  push:
    branches:
      - 'main'
jobs:

  draft-release:
    name: 'Draft Release'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v4
      - name: 'Make release'
        id: 'make-release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=v$(cat package/version)
          gh release create "${VERSION}"                \
            --repo "${GITHUB_REPOSITORY}"               \
            --draft                                     \
            --title "${VERSION}"                        \
            --target ${{ github.sha }}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  nix-cache:
    name: 'Populate Nix Caches'
    strategy:
      matrix:
        runner: [normal, ARM64]
    runs-on: ${{ matrix.runner }}
    needs: draft-release
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The build-and-publish logic lives in scripts/deploy.sh so CI and manual
      # deployments stay in sync (single source of truth). See scripts/README.md.
      - name: 'Build and publish komet-node to both Nix caches'
        shell: bash
        env:
          CACHIX_PUBLIC_TOKEN: '${{ secrets.CACHIX_PUBLIC_TOKEN }}'
          CACHIX_PRIVATE_KFB_TOKEN: '${{ secrets.CACHIX_PRIVATE_KFB_TOKEN }}'
          OWNER_REPO: '${{ github.repository }}'
          REV: '${{ github.sha }}'
        run: ./scripts/deploy.sh nix-cache

      - name: 'On failure, delete drafted release'
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=v$(cat package/version)
          gh release delete "${VERSION}"                  \
            --repo "${GITHUB_REPOSITORY}"                \
            --yes                                       \
            --cleanup-tag || true

  dockerhub:
    name: 'Build and Publish Docker Image'
    runs-on: [self-hosted, linux, normal]
    needs: draft-release
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Build, smoke-test, and push logic lives in scripts/deploy.sh so CI and
      # manual deployments stay in sync (single source of truth). See scripts/README.md.
      - name: 'Build, test, and push Docker image to Docker Hub'
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: ./scripts/deploy.sh docker

      - name: 'On failure, delete drafted release'
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=v$(cat package/version)
          gh release delete "${VERSION}"                  \
            --repo "${GITHUB_REPOSITORY}"                \
            --yes                                       \
            --cleanup-tag || true

  cut-release:
    name: 'Cut Release'
    runs-on: ubuntu-latest
    needs: [dockerhub, nix-cache]
    steps:
      - name: 'Check out code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 'Finalize Release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=v$(cat package/version)
          gh release edit "${VERSION}"                    \
            --repo "${GITHUB_REPOSITORY}"                 \
            --draft=false
